name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # app/sitemap.ts derives lastmod from per-file commit dates and
          # deliberately omits the field on a shallow clone. Full history keeps
          # the dates real in CI-built output.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22+ runs the .mts tests directly via native type stripping.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
